<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M64 10 L108 26 C108 72 84 104 64 118 C44 104 20 72 20 26 Z" 
        fill="url(#glowGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="4" 
        stroke-linejoin="round" />

  <!-- Inner Architectural Lattice / Layers -->
  <g filter="url(#glow)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Layer (Presentation / UI) -->
    <path d="M64 36 L88 48 L64 60 L40 48 Z" fill="rgba(59, 130, 246, 0.4)" stroke="#93c5fd" />
    
    <!-- Middle Layer (Domain / Features) -->
    <path d="M40 62 L64 74 L88 62" stroke="#c4b5fd" />
    
    <!-- Bottom Layer (Core / Infrastructure) -->
    <path d="M40 76 L64 88 L88 76" stroke="#ddd6fe" />
    
    <!-- Vertical Dependency Edges -->
    <line x1="64" y1="60" x2="64" y2="74" stroke="#a78bfa" stroke-dasharray="2,2" />
    <line x1="64" y1="74" x2="64" y2="88" stroke="#a78bfa" stroke-dasharray="2,2" />
  </g>

  <!-- Pulse Center Core Node -->
  <circle cx="64" cy="48" r="3.5" fill="#60a5fa" />
  <circle cx="64" cy="62" r="3" fill="#a78bfa" />
  <circle cx="64" cy="76" r="3" fill="#c084fc" />
</svg>

