name: DevArchitect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          pnpm install
          pnpm approve-builds --all

      - name: Build packages
        run: pnpm run build

      - name: Run automated test suite
        run: pnpm run test

      - name: Run DevArchitect self-analysis
        run: pnpm --filter @devarchitect/cli run start -- doctor

