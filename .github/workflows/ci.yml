name: DevArchitect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d79298aa8cacf6a987d # v4.0.0
        with:
          version: 12.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run automated test suite
        run: pnpm run test

      - name: Run DevArchitect self-analysis
        run: pnpm --filter @devarchitect/cli run start -- doctor

